<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Routine - ToDoリスト</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- ToDoアプリ -->
  <div class="app">
    <div class="app-header">
      <h1>Daily Routine</h1>
      <p class="date" id="currentDate"></p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText">0 / 0 完了</p>
    </div>
    <div class="app-body">

      <!-- タスク種別トグル -->
      <div class="type-toggle">
        <button class="type-btn active" id="typeRoutine">毎日</button>
        <button class="type-btn" id="typeOnce">1回のみ</button>
      </div>

      <!-- カテゴリ・時刻選択 -->
      <div class="add-options">
        <select class="cat-select" id="categorySelect">
          <option value="morning">朝</option>
          <option value="afternoon">昼</option>
          <option value="evening">夜</option>
          <option value="anytime">いつでも</option>
        </select>
        <input type="time" id="taskTime" value="07:00">
        <input type="date" id="taskDeadline" style="display:none; padding:8px 10px; border:2px solid #e0d8f0; border-radius:12px; font-size:0.85rem; outline:none;">
      </div>

      <!-- 入力フォーム -->
      <div class="add-form">
        <input type="text" id="taskInput" placeholder="新しいルーティーンを追加...">
        <button class="add-btn" id="addBtn">追加</button>
      </div>

      <!-- カテゴリフィルタ -->
      <div class="category-filter">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="morning">朝</button>
        <button class="filter-btn" data-filter="afternoon">昼</button>
        <button class="filter-btn" data-filter="evening">夜</button>
        <button class="filter-btn" data-filter="anytime">いつでも</button>
      </div>

      <!-- タスクリスト -->
      <ul class="task-list" id="taskList"></ul>

    </div>
  </div>

  <!-- 達成ヒートマップ -->
  <div class="heatmap-card">
    <h2>達成記録</h2>
    <p class="heatmap-subtitle">過去26週間のルーティーン達成率</p>
    <div class="heatmap-wrapper">
      <div class="heatmap-grid">
        <!-- 曜日ラベル -->
        <div class="heatmap-labels-y">
          <div class="day-label"></div>
          <div class="day-label">月</div>
          <div class="day-label"></div>
          <div class="day-label">水</div>
          <div class="day-label"></div>
          <div class="day-label">金</div>
          <div class="day-label"></div>
        </div>
        <!-- 週グリッド -->
        <div>
          <div class="heatmap-month-labels" id="monthLabels"></div>
          <div class="heatmap-weeks" id="heatmapWeeks"></div>
        </div>
      </div>
    </div>
    <!-- 凡例 -->
    <div class="heatmap-legend">
      <span class="legend-label">少</span>
      <div class="legend-cell" style="background:#eee"></div>
      <div class="legend-cell" data-level="1" style="background:#d8b4fe"></div>
      <div class="legend-cell" data-level="2" style="background:#a78bfa"></div>
      <div class="legend-cell" data-level="3" style="background:#7c3aed"></div>
      <div class="legend-cell" data-level="4" style="background:#4c1d95"></div>
      <span class="legend-label">多</span>
    </div>
  </div>

  <script>
    const STORAGE_KEY   = 'daily-routine-tasks';
    const HISTORY_KEY   = 'daily-routine-history';
    const LAST_DATE_KEY = 'daily-routine-last-date';

    // ---- デフォルトタスク ----
    const defaultTasks = [
      { id: 1, name: '起床・ストレッチ', time: '06:30', category: 'morning',   type: 'routine', done: false },
      { id: 2, name: '朝食',             time: '07:00', category: 'morning',   type: 'routine', done: false },
      { id: 3, name: 'メールチェック',    time: '09:00', category: 'morning',   type: 'routine', done: false },
      { id: 4, name: '昼食',             time: '12:00', category: 'afternoon', type: 'routine', done: false },
      { id: 5, name: '散歩・休憩',       time: '15:00', category: 'afternoon', type: 'routine', done: false },
      { id: 6, name: '夕食',             time: '19:00', category: 'evening',   type: 'routine', done: false },
      { id: 7, name: '読書',             time: '21:00', category: 'evening',   type: 'routine', done: false },
      { id: 8, name: '就寝準備',         time: '23:00', category: 'evening',   type: 'routine', done: false },
    ];

    let tasks         = loadTasks();
    let history       = loadHistory();
    let currentFilter = 'all';
    let taskType      = 'routine'; // 入力中のタスク種別

    const categoryLabels = {
      morning: '朝', afternoon: '昼', evening: '夜', anytime: 'いつでも',
    };

    // ---- ストレージ ----
    function loadTasks() {
      const s = localStorage.getItem(STORAGE_KEY);
      return s ? JSON.parse(s) : [...defaultTasks];
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function loadHistory() {
      const s = localStorage.getItem(HISTORY_KEY);
      return s ? JSON.parse(s) : {};
    }

    function saveHistory() {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    // ---- ユーティリティ ----
    function getNextId() {
      return tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
    }

    function toDateStr(date) {
      // ローカル時刻で YYYY-MM-DD を返す（ISOStringはUTCのためズレることがある）
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function todayStr() {
      return toDateStr(new Date());
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // ---- 日付変更チェック・リセット ----
    function checkDateReset() {
      const today    = todayStr();
      const lastDate = localStorage.getItem(LAST_DATE_KEY);

      if (lastDate !== today) {
        // 毎日タスクの完了状態をリセット
        tasks = tasks.map(t =>
          t.type === 'routine' ? { ...t, done: false } : t
        );
        // 期限切れの1回のみタスクを削除
        tasks = tasks.filter(t => {
          if (t.type !== 'once') return true;
          if (!t.deadline)       return true;
          return t.deadline >= today;
        });
        localStorage.setItem(LAST_DATE_KEY, today);
        saveTasks();
      }
    }

    // ---- 日付・進捗 ----
    function updateDate() {
      const now = new Date();
      const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString('ja-JP', opts);
    }

    function updateProgress() {
      // 進捗は「毎日タスク」のみでカウント
      const routineTasks = tasks.filter(t => t.type === 'routine');
      const total = routineTasks.length;
      const done  = routineTasks.filter(t => t.done).length;
      const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = `${done} / ${total} 完了`;

      // 今日の達成率を記録
      history[todayStr()] = pct;
      saveHistory();
      renderHeatmap();
    }

    // ---- タスク描画 ----
    function render() {
      const list    = document.getElementById('taskList');
      const today   = todayStr();
      const filtered = [...tasks]
        .sort((a, b) => a.time.localeCompare(b.time))
        .filter(t => currentFilter === 'all' || t.category === currentFilter);

      if (filtered.length === 0) {
        list.innerHTML = '<li class="empty-message">タスクがありません</li>';
      } else {
        list.innerHTML = filtered.map(task => {
          const isExpired = task.type === 'once' && task.deadline && task.deadline < today;
          const deadlineBadge = task.type === 'once'
            ? `<span class="task-deadline ${isExpired ? 'expired' : ''}">
                ${isExpired ? '期限切れ' : (task.deadline ? `期限: ${task.deadline}` : '1回のみ')}
               </span>`
            : '';
          return `
            <li class="task-item ${task.done ? 'done' : ''} ${isExpired ? 'expired' : ''}" data-id="${task.id}">
              <div class="task-checkbox" onclick="toggleTask(${task.id})">
                <span class="check-icon">&#10003;</span>
              </div>
              <div class="task-content">
                <div class="task-name">${escapeHtml(task.name)}</div>
                <div class="task-meta">
                  <span class="task-time">${task.time}</span>
                  <span class="task-category cat-${task.category}">${categoryLabels[task.category]}</span>
                  ${deadlineBadge}
                </div>
              </div>
              <button class="delete-btn" onclick="deleteTask(${task.id})" title="削除">&#10005;</button>
            </li>
          `;
        }).join('');
      }

      updateProgress();
    }

    // ---- タスク操作 ----
    function addTask() {
      const input = document.getElementById('taskInput');
      const name  = input.value.trim();
      if (!name) return;

      const deadline = taskType === 'once'
        ? document.getElementById('taskDeadline').value || null
        : null;

      tasks.push({
        id:       getNextId(),
        name,
        time:     document.getElementById('taskTime').value,
        category: document.getElementById('categorySelect').value,
        type:     taskType,
        deadline,
        done:     false,
      });

      input.value = '';
      saveTasks();
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) { task.done = !task.done; saveTasks(); render(); }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
    }

    // ---- タスク種別トグル ----
    document.getElementById('typeRoutine').addEventListener('click', () => {
      taskType = 'routine';
      document.getElementById('typeRoutine').classList.add('active');
      document.getElementById('typeOnce').classList.remove('active');
      document.getElementById('taskDeadline').style.display = 'none';
      document.getElementById('taskInput').placeholder = '新しいルーティーンを追加...';
    });

    document.getElementById('typeOnce').addEventListener('click', () => {
      taskType = 'once';
      document.getElementById('typeOnce').classList.add('active');
      document.getElementById('typeRoutine').classList.remove('active');
      document.getElementById('taskDeadline').style.display = 'block';
      document.getElementById('taskInput').placeholder = '1回限りのタスクを追加...';
    });

    // ---- ヒートマップ ----
    function pctToLevel(pct) {
      if (pct === undefined || pct === null) return 0;
      if (pct === 0)  return 0;
      if (pct <= 25)  return 1;
      if (pct <= 50)  return 2;
      if (pct <= 75)  return 3;
      return 4;
    }

    function renderHeatmap() {
      const WEEKS   = 26;
      const today   = new Date();
      today.setHours(0, 0, 0, 0);
      const tStr    = todayStr();

      const startDate = new Date(today);
      startDate.setDate(startDate.getDate() - startDate.getDay() - (WEEKS - 1) * 7);

      const weeksEl     = document.getElementById('heatmapWeeks');
      const monthLabels = document.getElementById('monthLabels');
      weeksEl.innerHTML     = '';
      monthLabels.innerHTML = '';

      const CELL_W  = 13 + 3;
      let lastMonth = -1;

      for (let w = 0; w < WEEKS; w++) {
        const weekEl = document.createElement('div');
        weekEl.className = 'heatmap-week';

        for (let d = 0; d < 7; d++) {
          const date    = new Date(startDate);
          date.setDate(startDate.getDate() + w * 7 + d);
          const dateStr = toDateStr(date);
          const isFuture = date > today;

          const cell = document.createElement('div');
          cell.className = 'heatmap-cell';
          if (dateStr === tStr) cell.classList.add('today');

          if (!isFuture) {
            const pct   = history[dateStr];
            const level = pctToLevel(pct);
            if (level > 0) cell.setAttribute('data-level', level);
            const label = pct !== undefined
              ? `${date.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })} — ${pct}% 達成`
              : `${date.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })} — 記録なし`;
            cell.setAttribute('data-tooltip', label);
          } else {
            cell.style.opacity = '0.3';
          }

          weekEl.appendChild(cell);

          if (d === 0) {
            const month = date.getMonth();
            const span  = document.createElement('span');
            span.className  = 'month-label';
            span.style.minWidth = CELL_W + 'px';
            if (month !== lastMonth) {
              span.textContent = (date.getMonth() + 1) + '月';
              lastMonth = month;
            }
            monthLabels.appendChild(span);
          }
        }

        weeksEl.appendChild(weekEl);
      }
    }

    // ---- イベント ----
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    document.getElementById('addBtn').addEventListener('click', addTask);
    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    // ---- 初期化 ----
    checkDateReset();
    updateDate();
    render();
    renderHeatmap();
  </script>
</body>
</html>
